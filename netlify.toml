[[redirects]]
  from = "/api/*"
  to = "https://apiautomation.iryax.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "https://apiautomation.iryax.com/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://apiautomation.iryax.com/health"
  status = 200
  force = true

[[redirects]]
  from = "/webhook/*"
  to = "https://apiautomation.iryax.com/webhook/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

