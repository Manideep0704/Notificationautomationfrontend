<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Notification Hub</title><link rel="stylesheet" href="styles.css"></head>
<body style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f1f5f9">
<main class="card" style="width:100%;max-width:420px;padding:36px">
<div class="brand-badge" style="color:#4f46e5">IRYAX GLOBAL</div><h1 style="margin:14px 0 8px;font-size:28px">Welcome back</h1><p style="color:#64748b;margin-bottom:28px">Sign in to your notification workspace.</p>
<form id="login-form"><div class="form-group"><label for="username">Email, Employee ID, or Username</label><input id="username" class="form-control" autocomplete="username" placeholder="e.g. saidulureddy@gmail.com or TH051" required autofocus></div>
<div class="form-group"><label for="password">Password</label><input type="password" id="password" class="form-control" autocomplete="current-password" required></div>
<p id="error" role="alert" style="color:#b91c1c;margin:12px 0"></p><button class="btn btn-primary" style="width:100%" type="submit">Sign in</button></form>
<p style="font-size:12px;color:#64748b;margin-top:24px">Sign in with your organization account credentials.</p></main>
<script src="config.js"></script><script src="login.js"></script></body></html>
